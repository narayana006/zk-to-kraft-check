[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zk-to-kraft-check"
version = "0.1.0"
description = "Check whether an Apache Kafka cluster is ready to migrate from ZooKeeper to KRaft, and list what blocks it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
keywords = ["kafka", "kraft", "zookeeper", "migration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/narayana006/zk-to-kraft-check"

[project.scripts]
zk-to-kraft-check = "zk_to_kraft_check.cli:main"

[tool.setuptools]
packages = ["zk_to_kraft_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
