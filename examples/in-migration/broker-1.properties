# ZooKeeper-mode broker in migration mode, waiting to be restarted as a KRaft broker.
broker.id=1
listeners=PLAINTEXT://:9092
advertised.listeners=PLAINTEXT://kafka-1.example.internal:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
inter.broker.protocol.version=3.9
log.dirs=/var/lib/kafka/data

zookeeper.metadata.migration.enable=true
zookeeper.connect=zk-0.example.internal:2181,zk-1.example.internal:2181,zk-2.example.internal:2181/kafka

controller.quorum.bootstrap.servers=kraft-0.example.internal:9093,kraft-1.example.internal:9093,kraft-2.example.internal:9093
controller.listener.names=CONTROLLER
