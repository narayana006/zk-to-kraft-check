# ZooKeeper-mode broker on Apache Kafka 3.9.1, before any migration step.
broker.id=0
listeners=PLAINTEXT://:9092
advertised.listeners=PLAINTEXT://kafka-0.example.internal:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
inter.broker.protocol.version=3.9

log.dirs=/var/lib/kafka/data
num.partitions=6
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

zookeeper.connect=zk-0.example.internal:2181,zk-1.example.internal:2181,zk-2.example.internal:2181/kafka
zookeeper.connection.timeout.ms=18000
