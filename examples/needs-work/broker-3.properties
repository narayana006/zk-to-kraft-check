# Same as the others, but this broker relies on an auto-generated broker id.
listeners=INTERNAL://:9092,CONTROL://:9094,EXTERNAL://:9093
advertised.listeners=INTERNAL://kafka-3.example.internal:9092,CONTROL://kafka-3.example.internal:9094,EXTERNAL://kafka-3.example.com:9093
listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROL:PLAINTEXT,EXTERNAL:SASL_SSL
inter.broker.listener.name=INTERNAL
control.plane.listener.name=CONTROL
inter.broker.protocol.version=3.6

sasl.enabled.mechanisms=SCRAM-SHA-512
authorizer.class.name=kafka.security.authorizer.AclAuthorizer
super.users=User:admin
alter.config.policy.class.name=com.example.kafka.policy.RetentionLimitPolicy

# Two disks per broker.
log.dirs=/data/disk1/kafka,/data/disk2/kafka

controlled.shutdown.max.retries=5
leader.imbalance.per.broker.percentage=10

zookeeper.connect=zk-0.example.internal:2181,zk-1.example.internal:2181,zk-2.example.internal:2181
zookeeper.set.acl=true
